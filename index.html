<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<meta name="theme-color" content="#1c1b17" />
<title>Finca Palos Verdes · Gerente de Finca</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">🌿</div>
      <h1>Panel de gestión</h1>
      <div class="sub">Finca Palos Verdes · acceso privado</div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn wide">Entrar</button>
        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-note">
        Acceso restringido a Olga Elizabeth y Juan. Esta es una herramienta interna y confidencial.
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = "app.html";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      if (login(email, password)) {
        window.location.href = "app.html";
      } else {
        document.getElementById("loginError").textContent = "Correo o contraseña incorrectos.";
      }
    });
  </script>
</body>
</html>
